[project]
name = "rsrch"
version = "0.1.0"
description = "Rsrch Studio - Modern Local Academic & Research Workspace"
readme = "README.md"
requires-python = ">=3.11"
scripts = { rsrch = "main:main" }
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "tecto>=0.17.0",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.pyright]
extraPaths = ["backend"]
